# Local PostgreSQL for development and tests.
# Host port 5435 avoids clashing with a locally installed PostgreSQL on 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: naas-postgres
    environment:
      POSTGRES_USER: naas
      POSTGRES_PASSWORD: naas
      POSTGRES_DB: naas
    ports:
      - "5435:5432"
    volumes:
      - naas-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naas -d naas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naas-pgdata:
